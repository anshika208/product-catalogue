
services:

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: catalogue-server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_URL: http://localhost:8080

      SALES_EMAIL: sales@example.com
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      USE_CONSOLE_EMAIL: "false"

    depends_on:
      - mailpit

    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
    container_name: catalogue-client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: catalogue-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
